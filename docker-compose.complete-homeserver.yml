  #############################################################################
  # UPTIME KUMA - Service monitoring & alerting
  #############################################################################
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=America/New_York
    restart: unless-stopped
    networks:
      - media-network

