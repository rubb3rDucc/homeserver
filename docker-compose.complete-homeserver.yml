version: "3.8"

# Complete Home Server Stack for Linux Mint PC
# Includes: Media automation, Jellyfin, Tunarr, Photo backup, Ad blocking
# Estimated RAM usage: 4-6GB | CPU: Moderate | Storage: ~50GB for configs

services:
  #############################################################################
  # VPN GATEWAY - Routes qBittorrent through Mullvad/NordVPN/PIA
  #############################################################################
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    dns:
      - "1.1.1.1"
      - "8.8.8.8"
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080" # qBittorrent WebUI (via VPN)
      - "6881:6881" # qBittorrent incoming connections
      - "6881:6881/udp"
    environment:
      # === CHOOSE YOUR VPN PROVIDER ===
      # Uncomment ONE section below:

      # --- Mullvad (Recommended) ---
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      # Pin a known-good server instead of rotating by city (reduces reconnect flapping).
      # If this host is ever retired, swap it or fall back to: SERVER_CITIES=Atlanta GA
      - SERVER_HOSTNAMES=us-atl-wg-403
      # Set MTU explicitly so gluetun skips path-MTU discovery (the source of the
      # 1320-revert loop seen on 2026-06-04). 1320 is safe for Mullvad WireGuard.
      - WIREGUARD_MTU=1320
      - DOT=off
      - DNS_PLAINTEXT_ADDRESS=1.1.1.1
      - BLOCK_MALICIOUS=off

      # --- NordVPN ---
      # - VPN_SERVICE_PROVIDER=nordvpn
      # - VPN_TYPE=wireguard
      # - WIREGUARD_PRIVATE_KEY=YOUR_NORDVPN_PRIVATE_KEY
      # - SERVER_COUNTRIES=United States

      # --- Private Internet Access ---
      # - VPN_SERVICE_PROVIDER=private internet access
      # - OPENVPN_USER=YOUR_PIA_USERNAME
      # - OPENVPN_PASSWORD=YOUR_PIA_PASSWORD
      # - SERVER_REGIONS=US East

      # General settings
      - TZ=${TZ} # Change to your timezone
    volumes:
      - gluetun-config:/gluetun
    restart: unless-stopped
    networks:
      - media-network

  #############################################################################
  # DOWNLOAD CLIENT - Routes through VPN
  #############################################################################
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun" # ⚠️ Routes ALL traffic through VPN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8080
    volumes:
      - qbittorrent-config:/config
      - ./downloads:/downloads
    depends_on:
      - gluetun
    # When gluetun restarts, qBittorrent's shared netns is destroyed and its WebUI
    # dies (Radarr then gets "connection refused"). This healthcheck goes unhealthy
    # when that happens; the deunhealth service below restarts qBittorrent so it
    # re-attaches to gluetun's fresh network namespace.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 5 http://localhost:8080 >/dev/null || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    labels:
      - deunhealth.restart.on.unhealthy=true
    restart: unless-stopped

  #############################################################################
  # DEUNHEALTH - Auto-restarts containers that go unhealthy (e.g. qBittorrent
  # when gluetun restarts and tears down the shared network namespace).
  # Watches for the label: deunhealth.restart.on.unhealthy=true
  #############################################################################
  deunhealth:
    image: qmcgaw/deunhealth:latest
    container_name: deunhealth
    network_mode: "none"
    environment:
      - TZ=America/New_York
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  #############################################################################
  # USENET DOWNLOAD CLIENT - SABnzbd (does NOT need the VPN)
  # Usenet uses SSL directly to your paid provider; no peers = no IP exposure,
  # so unlike qBittorrent this runs on the normal network for full speed.
  #############################################################################
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    ports:
      - "8085:8080" # WebUI (8080 is taken by qBittorrent via gluetun)
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - sabnzbd-config:/config
      - ./downloads:/downloads # Same mount Radarr/Sonarr already see
    restart: unless-stopped
    networks:
      - media-network

  #############################################################################
  # INDEXER MANAGER - Searches torrent sites
  #############################################################################
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports:
      - "9696:9696"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - prowlarr-config:/config
    restart: unless-stopped
    networks:
      - media-network

  #############################################################################
  # JELLYSEERR - Media request management (browse & request movies/TV)
  #############################################################################
  # jellyseerr:
  #   image: fallenbagel/jellyseerr:latest
  #   container_name: jellyseerr
  #   ports:
  #     - "5055:5055"
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - TZ=America/New_York
  #     - LOG_LEVEL=debug
  #   volumes:
  #     - jellyseerr-config:/app/config
  #   depends_on:
  #     - jellyfin
  #     - sonarr
  #     - radarr
  #   restart: unless-stopped
  #   networks:
  #     - media-network
  #############################################################################
  # SEERR - Media request management (browse & request movies/TV)
  #############################################################################
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - PUID=1000
      - PGID=1000
      - LOG_LEVEL=debug
      - TZ=America/New_York
      - PORT=5055 #optional
    ports:
      - 5055:5055
    depends_on:
      - jellyfin
      - sonarr
      - radarr
    volumes:
      - seerr-config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - media-network

  #############################################################################
  # TV SHOW AUTOMATION
  #############################################################################
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports:
      - "8989:8989"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - sonarr-config:/config
      - ./media/tv:/tv
      - ./downloads:/downloads
    depends_on:
      - prowlarr
      - qbittorrent
    restart: unless-stopped
    networks:
      - media-network

  #############################################################################
  # MOVIE AUTOMATION
  #############################################################################
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports:
      - "7878:7878"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - radarr-config:/config
      - ./media/movies:/movies
      - ./downloads:/downloads
    depends_on:
      - prowlarr
      - qbittorrent
    restart: unless-stopped
    networks:
      - media-network

  #############################################################################
  # JELLYFIN - On-demand media server (like Netflix)
  #############################################################################
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096" # WebUI
      - "8920:8920" # HTTPS (optional)
      - "7359:7359/udp" # Local discovery
      - "1900:1900/udp" # DLNA
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ./media:/data/media # All media in one folder
    devices:
      # Passing the device is NOT enough -- Jellyfin shipped with
      # HardwareAccelerationType=none, so every transcode (on-demand AND the
      # ErsatzTV Live TV channels, which Jellyfin transcodes a SECOND time on
      # top of ErsatzTV's own pass) ran on libx264 and pegged the CPU. Set in
      # Dashboard -> Playback -> Transcoding: VAAPI, /dev/dri/renderD128.
      # Live TV needs its own switch: Dashboard -> Live TV -> the M3U tuner ->
      # "Allow hardware transcoding", or it stays on software regardless.
      # Both live in the jellyfin-config volume, not here -- re-check them if
      # that volume is ever rebuilt.
      - /dev/dri:/dev/dri # Hardware transcoding (Intel/AMD GPU)
    restart: unless-stopped
    networks:
      - media-network

  #############################################################################
  # TUNARR - Linear TV channels (like cable)
  #############################################################################
  tunarr:
    image: chrisbenincasa/tunarr:latest
    container_name: tunarr
    ports:
      - "8000:8000"
    environment:
      - TZ=America/New_York
    volumes:
      - tunarr-config:/config
      - ./media:/media:ro # Same media as Jellyfin (read-only)
    restart: unless-stopped
    networks:
      - media-network

  #############################################################################
  # ERSATZTV - Advanced linear TV channels (commercials, bumpers, watermarks,
  # deterministic scheduling). WebUI: http://localhost:8409
  # Feeds Jellyfin Live TV via its M3U + XMLTV endpoints (shown in ErsatzTV UI).
  #############################################################################
  ersatztv:
    image: jasongdove/ersatztv:latest # unified image with VAAPI/QSV-capable ffmpeg
    container_name: ersatztv
    ports:
      - "8409:8409" # WebUI + M3U/XMLTV endpoints
    environment:
      - TZ=America/New_York
      # HW transcoding is NOT automatic: enable it in the WebUI per FFmpeg Profile
      # (Settings -> FFmpeg Profiles -> Hardware Acceleration = VAAPI,
      #  device /dev/dri/renderD128). Without it ErsatzTV encodes with software
      # libx264 and pegs the CPU (~220%/stream). This box has an Intel UHD 630;
      # pin its VAAPI driver so accel is deterministic:
      - LIBVA_DRIVER_NAME=iHD
    devices:
      - /dev/dri:/dev/dri # iGPU passthrough for VAAPI (required by the profile above)
    volumes:
      - ersatztv-config:/root/.local/share/ersatztv
      # Same shared media as Jellyfin/Tunarr (read-only). NOTE: ErsatzTV only
      # reads these files directly if a Path Replacement maps Jellyfin's view of
      # them onto this mount -- Settings -> Media Sources -> Jellyfin:
      #   /data/media  ->  /media
      # Without it ETV can't resolve the Jellyfin paths it stores, and silently
      # streams every channel's source over HTTP from Jellyfin instead (two
      # connections per channel, seeks as HTTP range requests on the spinning
      # disk). Lives in the ersatztv-config volume, not here.
      - ./media:/media:ro
    restart: unless-stopped
    networks:
      - media-network

  #############################################################################
  # PINCHFLAT - yt-dlp automation: subscribe to Vevo/artist channels & playlists
  # to auto-download and keep music videos + commercials fresh.
  # WebUI: http://localhost:8945  |  Source archive.org / RetroJunk / YouTube.
  #############################################################################
  pinchflat:
    image: ghcr.io/kieraneglin/pinchflat:latest
    container_name: pinchflat
    ports:
      - "8945:8945"
    environment:
      - TZ=America/New_York
    volumes:
      - pinchflat-config:/config
      # TV-station content lands here, kept separate from Jellyfin's movies/tv.
      # Configure Media Sources inside Pinchflat:
      #   music videos  -> /downloads/musicvideos       (ErsatzTV reads directly)
      #   commercials   -> /downloads/incoming/commercials  (station-processor cleans them up)
      #   indie animation -> /downloads/incoming/animation   (station-processor routes it:
      #                     shorts -> filler, episode-length -> staging/ for the TV library)
      # ErsatzTV reads these via its read-only ./media mount above.
      - ./media/station:/downloads
    restart: unless-stopped
    networks:
      - media-network

  #############################################################################
  # STATION-PROCESSOR - Ingest pipeline for filler content.
  # Watches ./media/station/incoming/*, splits commercial compilations on
  # black frames, normalizes loudness + resolution/fps, and outputs
  # channel-ready spots to ./media/station/library/* for ErsatzTV filler.
  #   incoming/commercials -> split + normalize
  #   incoming/bumpers     -> normalize only
  #   incoming/animation   -> route by duration: shorts become filler, longer
  #                           pieces are staged for the TV library by hand
  # Originals are archived to ./media/station/processed (nothing is deleted).
  #############################################################################
  station-processor:
    build: ./station-processor
    image: homeserver/station-processor:latest
    container_name: station-processor
    environment:
      - TZ=America/New_York
      - POLL_INTERVAL=60 # seconds between folder scans
      - TARGET_WIDTH=1920 # normalize everything to one resolution...
      - TARGET_HEIGHT=1080
      - TARGET_FPS=30 # ...and one framerate, so filler never letterboxes/judders
      # Filler loudness. Two-pass loudnorm (measure, then apply a linear gain),
      # so these land on target instead of overshooting it the way single-pass
      # does. -27 is measured from the library, not a broadcast spec: programming
      # medians -24.8 LUFS, and flat-level filler has to sit a couple LU under
      # dynamic programming to *feel* equal. Raise toward -25 if filler now feels
      # too quiet. Programming itself is deliberately NOT normalized at playout
      # (ErsatzTV NormalizeLoudnessMode=Off) so films keep their dynamic range.
      - LOUDNORM_I=-27 # target loudness (LUFS)
      - LOUDNORM_TP=-1.5 # max true peak (dBTP)
      - LOUDNORM_LRA=11 # loudness range
      - LOUDNORM_FLOOR=-60 # at/below this a clip is "silent" and left untouched
      - MIN_SPOT_SECONDS=5 # drop split fragments shorter than this
      - MAX_SPOT_SECONDS=180 # drop split fragments longer than this
      # "route" lanes (animation): at or under this it's an interstitial and
      # gets normalized into library/; over it, it's an episode and goes to
      # staging/ untouched for hand-placement into the TV library.
      - ROUTE_MAX_SECONDS=300
    volumes:
      - ./media/station:/station # incoming/, library/, staging/, processed/, logs/
    restart: unless-stopped
    networks:
      - media-network

  #############################################################################
  # RENDER-LANE - Remotion graphics generator. Reads the ErsatzTV schedule and
  # renders a "now/next/later" junction card on an interval into the station
  # library. Point an ErsatzTV filler preset at ./media/station/library/junctions.
  # (Idents + MTV nameplates will be added as more Remotion compositions later.)
  #############################################################################
  render-lane:
    build: ./render-lane
    image: homeserver/render-lane:latest
    container_name: render-lane
    # Remotion renders spawn headless Chrome; its subprocesses orphan into
    # unreapable zombies because node (PID 1) doesn't reap. tini reaps them.
    init: true
    environment:
      - TZ=America/New_York
      - ERSATZTV_URL=http://ersatztv:8409
      # Channels come from a gitignored .env next to this compose file:
      #   STATION_CHANNEL=          (now/next/later channel; blank = skip)
      #   STATION_MOVIE_CHANNEL=2,3,4,6   (feature card, one per channel)
      - CHANNEL=${STATION_CHANNEL:-}
      - MOVIE_CHANNEL=${STATION_MOVIE_CHANNEL:-}
      # Seconds between re-render cycles. Each cycle renders one card PER channel
      # via Remotion. Content only changes when the program does (~hours), and the
      # renderer now skips a card whose line-up is unchanged, so hourly is plenty
      # and keeps CPU idle between bursts.
      - INTERVAL=3600
      # Cores a single render may use (Remotion defaults to ~all of them). Kept
      # low so a render burst never starves ErsatzTV's live transcoding.
      - RENDER_CONCURRENCY=2
      # Chromium GL backend. Without this Remotion passes no --use-gl flag, so
      # headless Chrome rasterizes every gradient/shadow/filter in SwiftShader on
      # the CPU and decodes b-roll in software too. "angle-egl" uses the iGPU and
      # enables VaapiVideoDecoder. Requires the /dev/dri device below.
      # Set RENDER_GL=swangle to fall back to software rendering.
      - RENDER_GL=angle-egl
      - LIBVA_DRIVER_NAME=iHD # same driver ErsatzTV pins, for deterministic accel
      - ACCENT=#e50914 # brand accent color for all cards
      # Jellyfin token artwork. Put JELLYFIN_API_KEY in that same .env (never
      # committed); blank = tokens fall back to initials.
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
      # B-roll + instrumental music. Drop clips in ./media/station/broll and
      # tracks in ./media/station/music (host) -> /station/{broll,music}
      # (container); a random one of each plays per render.
      - BROLL_DIR=/station/broll
      - MUSIC_DIR=/station/music
      # - BROLL_SRC=
      # - MUSIC_SRC=
      - OUTPUT=/station/library/junctions/now-next-later.mp4
      - FEATURE_DIR=/station/library/feature
      # Card loudness. Without this a card lands wherever its rotating music bed
      # sits (junctions measured -19.9 LUFS against programming at -24.8), so
      # every junction was 6-10 LU hotter than the shows around it. Two-pass
      # loudnorm with a linear gain; keep in step with station-processor so all
      # filler matches. The Ident is silent by design and is skipped via FLOOR.
      - LOUDNORM_I=-27
      - LOUDNORM_TP=-1.5
      - LOUDNORM_LRA=11
      - LOUDNORM_FLOOR=-60
    devices:
      # iGPU passthrough so Chromium can rasterize on the GPU and hardware-decode
      # b-roll. Shared with ErsatzTV's VAAPI transcoding — renders are hourly and
      # short, so contention is brief, but this is the knob to pull if live
      # playout ever stutters during a render burst.
      - /dev/dri:/dev/dri
    volumes:
      - ./media/station:/station
    depends_on:
      - ersatztv
    restart: unless-stopped
    networks:
      - media-network

  #############################################################################
  # STATION-CURATOR - Programmer/curator for the channels. Rotates stale titles
  # out of each ErsatzTV Collection, refills from the library per a charter in
  # station-curator/charters.toml, keeps rerun blocks free of finales and
  # two-parters, and shortlists new titles to /state/proposals.md.
  #
  # Its ONLY DB write is collection membership; ErsatzTV etags collections and
  # rebuilds affected playouts itself, so schedules/blocks/filler are untouched.
  # The one exception is dead air: a channel still booked onto deleted files
  # gets ErsatzTV's trash emptied and its playout reset via ETV's HTTP API.
  # Dry run first:  docker compose ... run --rm -e CURATOR_DRY_RUN=1 station-curator
  #############################################################################
  station-curator:
    build: ./station-curator
    image: homeserver/station-curator:latest
    container_name: station-curator
    environment:
      - TZ=America/New_York
      - CURATOR_INTERVAL=21600 # 6h; the library changes slowly
      - CURATOR_DRY_RUN=${CURATOR_DRY_RUN:-false}
      - ERSATZTV_DB=/ersatztv/ersatztv.sqlite3
      # Dead-air repair: empty_trash + per-channel playout reset.
      - ERSATZTV_URL=http://ersatztv:8409
      # Watch data -> rests anything you just watched on demand.
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
      # Used only to dedupe acquisition proposals against what you already own.
      - RADARR_URL=http://radarr:7878
      - RADARR_API_KEY=${RADARR_API_KEY:-}
      - SONARR_URL=http://sonarr:8989
      - SONARR_API_KEY=${SONARR_API_KEY:-}
      # Free TMDB read key; blank = no acquisition shortlist, everything else runs.
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      # Optional taste pass (serialized-show + charter-fit calls, cached
      # forever). Blank = fully deterministic curation.
      # Gemini is the default provider and needs no package -- it's plain REST.
      # To use Claude instead, set CURATOR_LLM_PROVIDER=anthropic AND rebuild
      # with --build-arg WITH_ANTHROPIC=1 (that backend needs its SDK).
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CURATOR_LLM_PROVIDER=${CURATOR_LLM_PROVIDER:-}
      # Blank = the provider's own default (gemini-2.5-flash / claude-opus-5).
      - CURATOR_LLM_MODEL=${CURATOR_LLM_MODEL:-}
      # Push when new titles are worth a look (same ntfy topic style as diskmon).
      - CURATOR_NTFY_URL=${CURATOR_NTFY_URL:-}
      # Titles per notification; the list is paginated across as many pushes
      # as it takes rather than truncated.
      - CURATOR_NTFY_PER_PUSH=${CURATOR_NTFY_PER_PUSH:-8}
      # Channels asking for new-title ideas per cycle. Each is one LLM call,
      # cached for a week. 3 suits a free key; raise it on a paid tier.
      - CURATOR_SUGGEST_PER_CYCLE=${CURATOR_SUGGEST_PER_CYCLE:-3}
      # The report is served as a web page so it can be read without ssh.
      # CURATOR_REPORT_URL is what tapping a phone notification opens, so it
      # must be reachable from the phone -- use the tailnet name.
      - CURATOR_REPORT_PORT=8477
      - CURATOR_REPORT_URL=${CURATOR_REPORT_URL:-http://optiplex:8477/}
    ports:
      - "8477:8477" # curator report (read-only page)
    volumes:
      # Charters are meant to be hand-edited, so mount the repo copy rather
      # than baking it in: edit station-curator/charters.toml, then
      #   docker restart station-curator
      # No rebuild needed.
      - ./station-curator/charters.toml:/app/charters.toml:ro
      # Read-write: the curator edits CollectionItem rows and nothing else.
      - ersatztv-config:/ersatztv
      # Ledger + proposals.md, readable from the host.
      - ./media/station/curator:/state
    depends_on:
      - ersatztv
    restart: unless-stopped
    networks:
      - media-network

  #############################################################################
  # RENDER-STUDIO - Remotion Studio (visual editor) for restyling idents/cards
  # in a browser at http://<server-ip>:3000. Optional: only starts when asked:
  #   docker compose --profile studio up -d render-studio
  # Bind-mounts ./render-lane so edits persist to the repo (commit them there).
  #############################################################################
  render-studio:
    build: ./render-lane
    image: homeserver/render-lane:latest
    container_name: render-studio
    profiles: ["studio"]
    ports:
      - "3000:3000"
    environment:
      - TZ=America/New_York
    volumes:
      - ./render-lane:/app # live source so Studio edits reflect immediately
      - /app/node_modules # keep the image's installed deps (don't shadow them)
    entrypoint: ["npx", "remotion", "studio", "--host", "0.0.0.0", "--port", "3000"]
    restart: unless-stopped
    networks:
      - media-network

  #############################################################################
  # IMMICH - Photo backup & management (Google Photos alternative)
  #############################################################################
  # immich-server:
  #   image: ghcr.io/immich-app/immich-server:release
  #   container_name: immich-server
  #   ports:
  #     - "2283:3001"
  #   environment:
  #     - DB_HOSTNAME=immich-postgres
  #     - DB_USERNAME=postgres
  #     - DB_PASSWORD=postgres
  #     - DB_DATABASE_NAME=immich
  #     - REDIS_HOSTNAME=immich-redis
  #     - TZ=America/New_York
  #   volumes:
  #     - ./media/photos:/usr/src/app/upload
  #     - /etc/localtime:/etc/localtime:ro
  #   depends_on:
  #     - immich-postgres
  #     - immich-redis
  #   restart: unless-stopped
  #   networks:
  #     - media-network

  # immich-machine-learning:
  #   image: ghcr.io/immich-app/immich-machine-learning:release
  #   container_name: immich-ml
  #   environment:
  #     - TZ=America/New_York
  #   volumes:
  #     - immich-ml-cache:/cache
  #   restart: unless-stopped
  #   networks:
  #     - media-network

  # immich-postgres:
  #   image: tensorchord/pgvecto-rs:pg14-v0.2.0
  #   container_name: immich-postgres
  #   environment:
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=postgres
  #     - POSTGRES_DB=immich
  #   volumes:
