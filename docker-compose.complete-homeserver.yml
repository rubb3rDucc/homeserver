version: "3.8"

# Complete Home Server Stack for Linux Mint PC
# Includes: Media automation, Jellyfin, Tunarr, Photo backup, Ad blocking
# Estimated RAM usage: 4-6GB | CPU: Moderate | Storage: ~50GB for configs

services:
  #############################################################################
  # VPN GATEWAY - Routes qBittorrent through Mullvad/NordVPN/PIA
  #############################################################################
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    dns:
      - "1.1.1.1"
      - "8.8.8.8"
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080" # qBittorrent WebUI (via VPN)
      - "6881:6881" # qBittorrent incoming connections
      - "6881:6881/udp"
    environment:
      # === CHOOSE YOUR VPN PROVIDER ===
      # Uncomment ONE section below:

      # --- Mullvad (Recommended) ---
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_CITIES=Atlanta GA
      - DOT=off
      - DNS_PLAINTEXT_ADDRESS=1.1.1.1
      - BLOCK_MALICIOUS=off

      # --- NordVPN ---
      # - VPN_SERVICE_PROVIDER=nordvpn
      # - VPN_TYPE=wireguard
      # - WIREGUARD_PRIVATE_KEY=YOUR_NORDVPN_PRIVATE_KEY
      # - SERVER_COUNTRIES=United States

      # --- Private Internet Access ---
      # - VPN_SERVICE_PROVIDER=private internet access
      # - OPENVPN_USER=YOUR_PIA_USERNAME
      # - OPENVPN_PASSWORD=YOUR_PIA_PASSWORD
      # - SERVER_REGIONS=US East

      # General settings
      - TZ=${TZ} # Change to your timezone
    volumes:
      - gluetun-config:/gluetun
    restart: unless-stopped
    networks:
      - media-network

  #############################################################################
  # DOWNLOAD CLIENT - Routes through VPN
  #############################################################################
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun" # ⚠️ Routes ALL traffic through VPN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8080
    volumes:
      - qbittorrent-config:/config
      - ./downloads:/downloads
    depends_on:
      - gluetun
    restart: unless-stopped

  #############################################################################
  # INDEXER MANAGER - Searches torrent sites
  #############################################################################
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports:
      - "9696:9696"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - prowlarr-config:/config
    restart: unless-stopped
    networks:
      - media-network

  #############################################################################
  # JELLYSEERR - Media request management (browse & request movies/TV)
  #############################################################################
  # jellyseerr:
  #   image: fallenbagel/jellyseerr:latest
  #   container_name: jellyseerr
  #   ports:
  #     - "5055:5055"
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - TZ=America/New_York
  #     - LOG_LEVEL=debug
  #   volumes:
  #     - jellyseerr-config:/app/config
  #   depends_on:
  #     - jellyfin
  #     - sonarr
  #     - radarr
  #   restart: unless-stopped
  #   networks:
  #     - media-network
  #############################################################################
  # SEERR - Media request management (browse & request movies/TV)
  #############################################################################
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - PUID=1000
      - PGID=1000
      - LOG_LEVEL=debug
      - TZ=America/New_York
      - PORT=5055 #optional
    ports:
      - 5055:5055
    depends_on:
      - jellyfin
      - sonarr
      - radarr
    volumes:
      - seerr-config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - media-network

  #############################################################################
  # TV SHOW AUTOMATION
  #############################################################################
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports:
      - "8989:8989"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - sonarr-config:/config
      - ./media/tv:/tv
      - ./downloads:/downloads
    depends_on:
      - prowlarr
      - qbittorrent
    restart: unless-stopped
    networks:
      - media-network

  #############################################################################
  # MOVIE AUTOMATION
  #############################################################################
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports:
      - "7878:7878"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - radarr-config:/config
      - ./media/movies:/movies
      - ./downloads:/downloads
    depends_on:
      - prowlarr
      - qbittorrent
    restart: unless-stopped
    networks:
      - media-network

  #############################################################################
  # JELLYFIN - On-demand media server (like Netflix)
  #############################################################################
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096" # WebUI
      - "8920:8920" # HTTPS (optional)
      - "7359:7359/udp" # Local discovery
      - "1900:1900/udp" # DLNA
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ./media:/data/media # All media in one folder
    devices:
      - /dev/dri:/dev/dri # Hardware transcoding (Intel/AMD GPU)
    restart: unless-stopped
    networks:
      - media-network

  #############################################################################
  # TUNARR - Linear TV channels (like cable)
  #############################################################################
  tunarr:
    image: chrisbenincasa/tunarr:latest
    container_name: tunarr
    ports:
      - "8000:8000"
    environment:
      - TZ=America/New_York
    volumes:
      - tunarr-config:/config
      - ./media:/media:ro # Same media as Jellyfin (read-only)
    restart: unless-stopped
    networks:
      - media-network

