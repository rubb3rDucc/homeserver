  #     - TZ=America/New_York
  #   volumes:
  #     - immich-ml-cache:/cache
  #   restart: unless-stopped
  #   networks:
  #     - media-network

  # immich-postgres:
  #   image: tensorchord/pgvecto-rs:pg14-v0.2.0
